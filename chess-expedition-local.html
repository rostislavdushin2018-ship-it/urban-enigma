<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<style>

:root{--bg:#0c2230;--bg2:#12344a;--panel:#173f58;--panel2:#1d4d6b;--ink:#eef7f4;--muted:#9bbdc9;--gold:#ffc83d;--good:#3ddc97;--bad:#ff5c6c;--sql:#e8f3ec;--sqd:#5b9c8f;--line:rgba(255,255,255,.12);--disp:'Fredoka','Trebuchet MS',system-ui,sans-serif;--body:'Nunito',system-ui,sans-serif;color-scheme:dark}

.cand.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 22%,#173f58)}.cand.x{opacity:.45;text-decoration:line-through}.cand:disabled{cursor:default}
.cbadge{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:var(--c);color:#0c2230;font-family:var(--disp);font-weight:700;font-size:24px;flex:none}
.ct{flex:1}.cx{color:var(--bad);font-size:26px}
.boss{display:flex;align-items:center;gap:14px}.bossem{font-size:64px;line-height:1}.bossem.hit{animation:shake .5s}.bossin{flex:1;display:flex;flex-direction:column;gap:6px}
.chips{display:flex;gap:8px;flex-wrap:wrap}.pill{background:#0c2230;border-radius:999px;padding:4px 14px;font-weight:800;font-size:16px}.pill.gold{color:var(--gold)}

/* настройка */

.hero{text-align:center}.hero h1{font-size:clamp(36px,6vw,72px);font-weight:700;line-height:1.05;color:var(--gold)}.kings{font-size:60px;letter-spacing:.2em;color:var(--ink)}.sub{color:var(--muted);font-size:22px;margin-top:6px}.hero.small .kings{font-size:90px;letter-spacing:0;animation:pop .6s}
.setup .panel{width:100%;max-width:1100px;background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:24px;display:flex;flex-direction:column;gap:18px}
.ncount{display:flex;gap:12px}.nbtn{width:84px;height:72px;border-radius:18px;background:var(--panel2);font-family:var(--disp);font-weight:700;font-size:38px;border:3px solid transparent}.nbtn.on{border-color:var(--gold);background:#3a3410;color:var(--gold)}

.emojis{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:4px}.emo{font-size:24px;height:44px;min-width:0;padding:0;border-radius:10px;border:2px solid transparent}.emo.on{border-color:var(--tc);background:rgba(255,255,255,.12)}.emo:hover{background:rgba(255,255,255,.1)}

<script>
/* ===== ШАХМАТНЫЙ ДВИЖОК (без en passant и рокировки) ===== */
const FILES = 'abcdefgh';
const sqName = (r, c) => FILES[c] + (8 - r);
const sqRC = (s) => [8 - parseInt(s[1], 10), FILES.indexOf(s[0])];
const inB = (r, c) => r >= 0 && r < 8 && c >= 0 && c < 8;
const other = (c) => (c === 'w' ? 'b' : 'w');

function parseFEN(fen) {
  const [place, turn] = fen.split(' ');
  const board = place.split('/').map((row) => {
    const out = [];

/* клетки, которые фигура "бьёт" (атакует), независимо от того, что на них стоит */
function pieceAttacks(board, r, c) {

    [-1, 1].forEach((dc) => { if (inB(r + dr, c + dc)) res.push([r + dr, c + dc]); });

    D('certs', D('lbl big', 'Сертификаты команд'),

      h(Cert, { team: sorted[cur], place: sorted[cur].place, n: sorted.length })),
    D('act center', Btn('go alt', onBack, 'Вернуться к карте'), Btn('go', onAgain, 'Новый турнир ', h(Icon, { n: 'rocket' }))));
}

/* ---- панель тренера ---- */
function Coach({ open, setOpen, coach, onFinish, onNext }) {
  const [ask, setAsk] = useState(false);
  const call = (k) => () => { Snd.click(); const f = coach.current && coach.current[k]; if (f) f(); };
  return D('coach' + (open ? ' open' : ''),
    open ? D('cpanel', D('ctitle', '🎓 Панель тренера'),
      Btn('cb hint', call('hint'), h(Icon, { n: 'bulb' }), ' Подсказка'),
      Btn('cb', call('answer'), h(Icon, { n: 'eye' }), ' Показать ответ'),
      Btn('cb', call('skip'), h(Icon, { n: 'skip' }), ' Пропустить задание'),
      Btn('cb', onNext, h(Icon, { n: 'next' }), ' Следующая станция'),
      ask ? D('askrow', D('', 'Завершить турнир и перейти к награждению?'), D('askb', Btn('cb warn', () => { setAsk(false); onFinish(); }, 'Да, награждаем'), Btn('cb', () => setAsk(false), 'Отмена')))
        : Btn('cb', () => setAsk(true), h(Icon, { n: 'flag' }), ' Завершить турнир')) : null,
    Btn('cfab', () => setOpen(!open), h(Icon, { n: open ? 'x' : 'cap', s: 26 })));
}

function App() {
  const [phase, setPhase] = useState('setup');
  const [teams, setTeams] = useState([]), [active, setActive] = useState(0), [st, setSt] = useState(0);
  const [prog, setProg] = useState([0, 0, 0, 0, 0, 0]), [stSecs, setStSecs] = useState([0, 0, 0, 0, 0, 0]);
  const [secs, setSecs] = useState(7200), [running, setRunning] = useState(true), [mute, setMute] = useState(false), [open, setOpen] = useState(false), [timeUp, setTimeUp] = useState(false);
  const coach = useRef({}), stRef = useRef(0); stRef.current = st;
  const pairs = useMemo(() => { const n = teams.length; return n === 2 ? [[0, 1], [1, 0], [0, 1]] : n === 3 ? [[0, 1], [1, 2], [2, 0]] : [[0, 1], [2, 3], [0, 2], [1, 3]]; }, [teams.length]);
  const counts = [COORD_TASKS.length, HUNT_TASKS.length, pairs.length, KING_TASKS.length, TRAP_TASKS.length, MATE_TASKS.length];

  useEffect(() => {
    if (phase !== 'play' || !running) return undefined;
    const id = setInterval(() => { setSecs((s) => Math.max(0, s - 1)); setStSecs((a) => a.map((v, k) => (k === stRef.current ? v + 1 : v))); }, 1000);
    return () => clearInterval(id);
  }, [phase, running]);
  useEffect(() => { if (phase === 'play' && secs === 0 && !timeUp) { setTimeUp(true); Snd.alarm(); } }, [secs, phase]);
  useEffect(() => { Snd.muted = mute; }, [mute]);

  const award = (k, pts) => setTeams((ts) => ts.map((t, j) => (j === k ? { ...t, score: Math.max(0, t.score + pts) } : t)));
  const advance = () => { setProg((p) => p.map((v, k) => (k === st ? v + 1 : v))); setActive((a) => (a + 1) % teams.length); coach.current = {}; };
  const start = (ts) => { setTeams(ts); setActive(0); setSt(0); setProg([0, 0, 0, 0, 0, 0]); setStSecs([0, 0, 0, 0, 0, 0]); setSecs(7200); setRunning(true); setTimeUp(false); setPhase('play'); };
  const goSt = (k) => { coach.current = {}; setSt(k); };
  const next = () => { if (st >= 5) setPhase('finish'); else goSt(st + 1); };
  const ctx = { teams, active, setActive, award, advance, coach, pairs };

  if (phase === 'setup') return h(Setup, { onStart: start });
  if (phase === 'finish') return h(Finish, { teams, onAgain: () => { setPhase('setup'); }, onBack: () => setPhase('play') });

  const Comp = [S1, S2, S3, S4, S5, S6][st], i = prog[st], total = counts[st], finished = i >= total;
  if (finished) coach.current = {};
  const low = secs <= 600;
  return D('app',
    D('top',
      D('brand', T('bk', '♞'), D('bt', D('b1', 'Шахматная экспедиция'), D('b2', 'Командный турнир'))),
      D('clock' + (low ? ' low' : '') + (!running ? ' paused' : ''), T('ctime', fmt(secs)), D('cbtns',
        Btn('ib', () => setRunning(!running), h(Icon, { n: running ? 'pause' : 'play' }), T('', running ? 'Пауза' : 'Пуск')),
        Btn('ib', () => { setSecs((s) => s + 300); setTimeUp(false); }, h(Icon, { n: 'plus' }), T('', '5 мин')),
        Btn('ib', () => { setSecs(7200); setRunning(false); setTimeUp(false); }, h(Icon, { n: 'reset' }), T('', 'Сброс')))),
      Btn('ib sound', () => { Snd.init(); setMute(!mute); }, h(Icon, { n: mute ? 'mute' : 'vol' }))),
    timeUp && secs === 0 ? D('timeup', '⏰ Время урока вышло! Можно добавить 5 минут или перейти к награждению.', Btn('ib', () => setPhase('finish'), 'К награждению')) : null,
    h(Teams, { teams, active, setActive, award }),
    h(MapBar, { st, setSt: goSt, prog, counts, stSecs }),
    finished ? D('stage-wrap', D('stbar', T('stico', STATIONS[st].icon), D('stt', D('stn', 'Станция ' + (st + 1) + ' · ' + STATIONS[st].name), D('stb', STATIONS[st].blurb))),
      h(StationDone, { st, teams, onNext: next, onRepeat: () => setProg((p) => p.map((v, k) => (k === st ? 0 : v))) }))
      : h(Comp, { key: st + '-' + i, ctx, idx: st, i, total }),
    h(Coach, { open, setOpen, coach, onFinish: () => setPhase('finish'), onNext: next }));
}

function Root() { return h(React.Fragment, null, h(App), h(Confetti)); }
ReactDOM.createRoot(document.getElementById('root')).render(h(Root));

</script>
</body></html>
